# The example sites that are packages of their own (the others under
# examples/sites/ are served by vite.panels.config.ts).
packages:
  - "examples/sites/*"
  - "examples/live-demo"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
# Our own package, which the example sites use as published: a new version
# is used as soon as it is out, not after pnpm's minimum release age.
minimumReleaseAgeExclude:
  - "@urth/three-html-panel"
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
