<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="An event timetable that follows the clock, from a JSON file."
    />
    <title>Timetable</title>
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <div class="app">
      <header class="top">
        <h1 id="title">読み込み中…</h1>
        <p id="subtitle"></p>
        <time class="clock" id="clock">--:--:--</time>
        <button type="button" class="speed" id="speed">早送り ×1</button>
      </header>
      <main class="body" id="body">
        <div class="scroller" id="scroller" aria-label="タイムライン">
          <div class="track" id="track">
            <div class="ruler" id="ruler"><div class="corner"></div></div>
            <div class="now-line" id="now-line"></div>
          </div>
        </div>
        <aside class="side">
          <h2>開催中</h2>
          <div class="cards" id="now-list"></div>
          <h2>まもなく</h2>
          <div class="cards" id="next-list"></div>
        </aside>
      </main>
    </div>
  </body>
</html>
