name: Release

# Publishes the npm package when a version tag (v0.1.0, ...) is pushed. npm
# trusts this workflow (Trusted Publishing, set on the package's settings on
# npmjs.com), so no token is stored here; the package gets provenance. Then
# makes the tag's GitHub Release, its notes the version's CHANGELOG.md section.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # For npm's Trusted Publishing (OIDC) and provenance.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          cache: true
      - name: The tag is package.json's version
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "The tag $GITHUB_REF_NAME is not package.json's version ($version)" >&2
            exit 1
          fi
      # Before publishing: the release notes would be missing otherwise.
      - name: CHANGELOG.md has the version
        run: .github/changelog-section.sh "${GITHUB_REF_NAME#v}" > /dev/null
      # The first version is published by hand (npm can only trust this
      # workflow once the package exists): its tag publishes nothing again.
      - name: Not published yet
        id: unpublished
        run: |
          if npm view "@urth/three-html-panel@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "@urth/three-html-panel@${GITHUB_REF_NAME#v} is on npm already"
          else
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi
      # prepublishOnly runs vp check, the unit tests and vp pack first.
      - if: steps.unpublished.outputs.yes == 'true'
        run: npm publish --provenance

  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # A re-run of the workflow leaves an existing release as it is.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "The release $GITHUB_REF_NAME exists already"
            exit 0
          fi
          .github/changelog-section.sh "${GITHUB_REF_NAME#v}" > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
