name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Installs Vite+ (the version in package.json), Node.js and the pnpm
      # version in package.json's packageManager, then runs `vp install`.
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          # The version package.json's devEngines asks for.
          node-version: "24"
          cache: true
      # Format, lint and type check.
      - run: vp check
      - run: vp test
      - run: vp build
      # The npm package builds, and passes publint.
      - run: vp pack
      # The example sites that are packages of their own: their own type checks
      # (vue-tsc, tsc, svelte-check) and builds.
      - run: vp run typecheck:sites
      - run: vp run build:sites
      # The live demo, a package of its own that uses the published package.
      - run: vp run typecheck:live-demo
      - run: vp run build:live-demo

  # The demo's panel pages driven in real browsers (playwright.config.ts): what
  # jsdom cannot show, such as what is drawn, the caret and the selection.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          cache: true
      - run: vp exec playwright install --with-deps chromium firefox webkit
      - run: vp run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
